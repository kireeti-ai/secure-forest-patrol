[platformio]
default_envs = esp32-s3-devkitm-1

; ── Shared base settings ───────────────────────────────────────────────────────
; Applied to every [env:*] unless explicitly overridden.
[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps =
    sandeepmistry/LoRa
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    -I include
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=0

; ── macOS environment (default) ────────────────────────────────────────────────
; pio run                        → build
; pio run --target upload        → upload
; pio device monitor             → monitor
[env:esp32-s3-devkitm-1]
upload_port = COM13
monitor_port = COM13

; ── Production backend environment ────────────────────────────────────────────
; Points at the production MQTT broker (HiveMQ Cloud, TLS on 8883).
; FOREST_MQTT_USERNAME/FOREST_MQTT_PASSWORD (the broker credentials created in
; the HiveMQ Cloud console) still come from Secrets.h, never from a build
; flag here -- see Secrets.example.h.
[env:production]
upload_port = /dev/cu.usbmodem5B5E0268161
monitor_port = /dev/cu.usbmodem5B5E0268161
build_flags =
    -I include
    -std=gnu++17
    -D FOREST_PRODUCTION_BACKEND=1
    -D FOREST_MQTT_BROKER_HOST="a3119662.ala.asia-southeast1.emqxsl.com"
    -D FOREST_MQTT_BROKER_PORT=8883
    -D FOREST_MQTT_TLS=1

; ── Diagnostic RF environment ──────────────────────────────────────────────────
[env:diagnostic-gateway]
upload_port = /dev/cu.usbmodem5B5E0268161
monitor_port = /dev/cu.usbmodem5B5E0268161
build_flags =
    -I include
    -std=gnu++17
    -D FOREST_RF_DIAGNOSTIC=1

; ── Windows environment ────────────────────────────────────────────────────────
; pio run -e windows --target upload   → upload
; pio device monitor -e windows        → monitor
; COM13 / COM15 are the active serial ports on this machine.
[env:windows]
upload_port = COM13
monitor_port = COM13
