[platformio]
default_envs = esp32-s3-devkitm-1

; ── Shared base settings ───────────────────────────────────────────────────────
; Applied to every [env:*] unless explicitly overridden.
[env]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps =
    sandeepmistry/LoRa
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
build_flags =
    -I include
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; ── macOS environment (default) ────────────────────────────────────────────────
; pio run                        → build
; pio run --target upload        → upload
; pio device monitor             → monitor
[env:esp32-s3-devkitm-1]
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101

; ── Production backend environment ────────────────────────────────────────────
; Points at the production MQTT broker (HiveMQ Cloud, TLS on 8883).
; JALRI_MQTT_USERNAME/JALRI_MQTT_PASSWORD (the broker credentials created in
; the HiveMQ Cloud console) still come from Secrets.h, never from a build
; flag here -- see Secrets.example.h.
[env:production]
upload_port = /dev/cu.usbmodem5B5E0268161
monitor_port = /dev/cu.usbmodem5B5E0268161
build_flags =
    -I include
    -std=gnu++17
    -D JALRI_PRODUCTION_BACKEND=1
    -D JALRI_MQTT_BROKER_HOST=\"4e0e2ee1c8c64712aca79f1eb66cb3e8.s1.eu.hivemq.cloud\"
    -D JALRI_MQTT_BROKER_PORT=8883
    -D JALRI_MQTT_TLS=1

; ── Diagnostic RF environment ──────────────────────────────────────────────────
[env:diagnostic-gateway]
upload_port = /dev/cu.usbmodem5B5E0268161
monitor_port = /dev/cu.usbmodem5B5E0268161
build_flags =
    -I include
    -std=gnu++17
    -D JALRI_RF_DIAGNOSTIC=1

; ── Windows environment ────────────────────────────────────────────────────────
; pio run -e windows --target upload   → upload
; pio device monitor -e windows        → monitor
; COM8 / COM10 detected (VID_1A86 / PID_55D3 — CH343 USB-Serial).
; Update the port below to whichever COM port this board enumerates as.
[env:windows]
upload_port = COM10
monitor_port = COM10
