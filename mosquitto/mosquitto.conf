# Local development broker only.
#
# No TLS, no authentication -- fine for a broker bound to localhost during
# development. Production deployments MUST enable both (see docs/MQTT.md
# and the spec's MQTT security requirements): configure `password_file`
# and a `listener 8883` with `cafile`/`certfile`/`keyfile`, and never point
# a Gateway at an unauthenticated broker over an untrusted network.

listener 1883
allow_anonymous true
persistence false
