; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5B5E0265961
monitor_port = /dev/cu.usbmodem5B5E0265961

board_build.flash_size = 16MB
board_build.psram = enabled
board_build.filesystem = littlefs
; INTEGRATED NODE: RFID attendance + LoRa + acoustic (MAX4466 trigger -> INMP441 -> TFLite Micro) in one
; firmware. RFID/LoRa/LED run in loop() on core 1; acoustic runs in tasks on core 0 and hands events to
; loop() through a queue. Everything acoustic is tunable with -D flags (lib/Acoustic/src/AcousticConfig.h).
; MAX4466 wiring/power fault fixed (rewired off breadboard, fresh jumpers, trimmer retuned); it now idles
; clean (RMS avg ~6, DC ~14-16) instead of stuck at the ADC rail. Relative-dB adaptive trigger re-verified
; on hardware: quiet floor ~6 RMS, real sound triggers at RMS ~70-100 with correct hysteresis release.
; See docs/ACOUSTIC_NODE.md.
lib_deps =
	sandeepmistry/LoRa
	tanakamasayuki/TensorFlowLite_ESP32
build_flags =
	-I include
	-std=gnu++17
	-D FOREST_ACOUSTIC=1                   ; 1 = acoustic pipeline on, 0 = off (quiets logs for RFID/fingerprint bench testing)
	-D FOREST_ACOUSTIC_TEST_MODE=0        ; 0 = field pipeline (MAX4466 gates INMP441 + ML). 4 = bench demo
	-D ACOUSTIC_RELATIVE_TRIGGER=1        ; adaptive floor-tracking trigger (verified on fixed hardware)
	-D ACOUSTIC_DEBUG_LOG=1
	-D ACOUSTIC_DEBUG_INTERVAL_MS=1000
	-D FOREST_FINGER_RX_PIN=16
	-D FOREST_FINGER_TX_PIN=17
	-D FOREST_FINGER_BAUD=57600
	-D FOREST_VERBOSE_STORE=1               ; 1 = normal boot-dump + retry logging, 0 = quiet (bench testing, no gateway attached)
	-D ARDUINO_USB_CDC_ON_BOOT=0
build_src_filter = +<main.cpp>
