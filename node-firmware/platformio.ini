; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5B5E0265961
monitor_port = /dev/cu.usbmodem5B5E0265961

board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps =
	sandeepmistry/LoRa
	miguelbalboa/MFRC522
build_flags =
	-I include
	-std=gnu++17
lib_ignore = Acoustic

[env:n3g-test-s3-node-a]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps =
	sandeepmistry/LoRa
	miguelbalboa/MFRC522
build_flags =
	-I include
	-std=gnu++17
	-D FOREST_TEST_MODE=1
	-D FOREST_NODE_ID=1
lib_ignore = Acoustic

[env:n3g-test-s3-node-b]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps =
	sandeepmistry/LoRa
	miguelbalboa/MFRC522
build_flags =
	-I include
	-std=gnu++17
	-D FOREST_TEST_MODE=1
	-D FOREST_NODE_ID=2
lib_ignore = Acoustic

; Node + acoustic pipeline (MAX4466 trigger -> INMP441 -> TFLite Micro -> LoRa event).
; The RFID-only env above is intentionally untouched until the acoustic hardware is
; validated. See docs/ACOUSTIC_NODE.md. Override pins / thresholds with -D flags
; (all names are in lib/Acoustic/src/AcousticConfig.h).
[env:esp32-s3-acoustic]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem5B5E0265961
monitor_port = /dev/cu.usbmodem5B5E0265961
board_build.flash_size = 16MB
board_build.psram = enabled
lib_deps =
	sandeepmistry/LoRa
	miguelbalboa/MFRC522
	tanakamasayuki/TensorFlowLite_ESP32
build_flags =
	-I include
	-std=gnu++17
	-D FOREST_ACOUSTIC=1
	; -D FOREST_ACOUSTIC_TEST_MODE=1   ; 1=MAX4466 RMS, 2=INMP441 stats, 3=ML known vectors
